<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جدولة انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#eee6f8;color:#291b3c}.wrap{max-width:1050px;margin:auto;padding:35px}.top{display:flex;justify-content:space-between}.logo{font-size:30px;font-weight:800;color:#7047c9}a{color:#7047c9;text-decoration:none;font-weight:700}.panel{background:#fff;border-radius:17px;padding:23px;margin-top:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:13px}textarea,input{width:100%;padding:12px;border:1px solid #d8cae9;border-radius:10px;font-family:inherit;margin:6px 0 14px}.platforms{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.platforms label{background:#f5effb;padding:8px 12px;border-radius:9px}.btn{border:0;background:linear-gradient(90deg,#7047c9,#9669e5,#e75a9c);color:#fff;padding:12px 20px;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer}.item{padding:14px;border-bottom:1px solid #eee4f6}.item:last-child{border:0}.item small{display:block;color:#766980}.msg{margin-top:12px;color:#16805a;font-weight:700}.error{color:#a33462}.empty{color:#776b82;font-size:13px}.safe{background:#edf9f4;border:1px solid #bee6d4;padding:12px;border-radius:10px;font-size:12px;margin-top:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">انشر ➤</div><a href="dashboard.html">← لوحة التحكم</a></div><h1>جدولة المحتوى</h1><div class="safe">نسخة تجريبية: الجدولة تُحفظ محليًا فقط ولا تنفذ نشرًا خارجيًا أو تكلفة مالية.</div><div class="panel"><label>المحتوى</label><textarea id="txt" placeholder="اكتب المحتوى المجدول"></textarea><div class="row"><div><label>التاريخ</label><input id="date" type="date"></div><div><label>الوقت</label><input id="time" type="time"></div></div><div class="platforms"><label><input type="checkbox" value="Instagram" checked> Instagram</label><label><input type="checkbox" value="Facebook" checked> Facebook</label><label><input type="checkbox" value="LinkedIn"> LinkedIn</label><label><input type="checkbox" value="Threads"> Threads</label></div><button class="btn" onclick="add()">إضافة للجدول التجريبي</button><div id="msg" class="msg"></div></div><div class="panel"><h2>المحتوى المجدول</h2><div id="list"></div></div></div><script src="app-state.js"></script><script>if(!Anshur.requireAuth())throw new Error('auth');const dateEl=document.getElementById('date');dateEl.min=new Date().toISOString().slice(0,10);function render(){const a=Anshur.get().scheduled,l=document.getElementById('list');l.innerHTML=a.length?'':'<div class="empty">لا توجد منشورات مجدولة بعد.</div>';a.forEach(x=>{const e=document.createElement('div');e.className='item';e.innerHTML='<b>'+x.text.slice(0,60)+'</b><small>'+x.when.replace('T',' • ')+' • '+x.platforms.join('، ')+' • محاكاة محفوظة محليًا</small>';l.appendChild(e)})}function add(){const t=document.getElementById('txt').value.trim(),d=dateEl.value,ti=document.getElementById('time').value,m=document.getElementById('msg'),p=[...document.querySelectorAll('.platforms input:checked')].map(x=>x.value);m.className='msg';if(!t||!d||!ti||!p.length){m.className='msg error';m.textContent='أكملي المحتوى والتاريخ والوقت واختاري منصة.';return}const when=new Date(d+'T'+ti);if(isNaN(when.getTime())||when<=new Date()){m.className='msg error';m.textContent='اختاري موعدًا مستقبليًا للجدولة.';return}const r=Anshur.schedule(t,d+'T'+ti,p);if(r&&r.ok===false){m.className='msg error';m.textContent=r.message||'تعذر حفظ الجدولة.';return}m.textContent='✓ حُفظت الجدولة محليًا. التكلفة 0 ريال.';document.getElementById('txt').value='';render()}render();</script></body></html>
