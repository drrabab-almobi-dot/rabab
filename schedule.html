<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جدولة انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#eee6f8;color:#291b3c}.wrap{max-width:1050px;margin:auto;padding:35px}.top{display:flex;justify-content:space-between}.logo{font-size:30px;font-weight:800;color:#7047c9}a{color:#7047c9;text-decoration:none;font-weight:700}.panel{background:#fff;border-radius:17px;padding:23px;margin-top:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:13px}textarea,input{width:100%;padding:12px;border:1px solid #d8cae9;border-radius:10px;font-family:inherit;margin:6px 0 14px}.platforms{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.platforms label{background:#f5effb;padding:8px 12px;border-radius:9px}.btn{border:0;background:linear-gradient(90deg,#7047c9,#9669e5,#e75a9c);color:#fff;padding:12px 20px;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer}.item{padding:14px;border-bottom:1px solid #eee4f6}.item:last-child{border:0}.item small{display:block;color:#766980}.msg{margin-top:12px;color:#16805a;font-weight:700}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">انشر ➤</div><a href="dashboard.html">← لوحة التحكم</a></div><h1>جدولة المحتوى</h1><div class="panel"><label>المحتوى</label><textarea id="txt" placeholder="اكتب المحتوى المجدول"></textarea><div class="row"><div><label>التاريخ</label><input id="date" type="date"></div><div><label>الوقت</label><input id="time" type="time"></div></div><div class="platforms"><label><input type="checkbox" checked> Instagram</label><label><input type="checkbox" checked> Facebook</label><label><input type="checkbox"> LinkedIn</label><label><input type="checkbox"> Threads</label></div><button class="btn" onclick="add()">إضافة للجدول التجريبي</button><div id="msg" class="msg"></div></div><div class="panel"><h2>المحتوى المجدول</h2><div id="list"><div class="item"><b>منشور تجريبي</b><small>غدًا • 10:00 ص • محاكاة محلية</small></div></div></div></div><script>function add(){const t=document.getElementById('txt').value.trim(),d=document.getElementById('date').value,ti=document.getElementById('time').value,m=document.getElementById('msg');if(!t||!d||!ti){m.textContent='أكملي المحتوى والتاريخ والوقت.';return}const e=document.createElement('div');e.className='item';e.innerHTML='<b>'+t.slice(0,45)+'</b><small>'+d+' • '+ti+' • محفوظ داخل النموذج فقط</small>';document.getElementById('list').prepend(e);m.textContent='✓ تمت إضافة الجدولة التجريبية. التكلفة 0 ريال.'}</script></body></html>
