<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#eee6f8;color:#291b3c}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:800;color:#7047c9}a{color:#7047c9;text-decoration:none;font-weight:700}.panel{background:#fff;border-radius:16px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9cbea;border-radius:10px;font-family:inherit;margin:6px 0 12px}textarea{height:110px}.btn{border:0;background:linear-gradient(90deg,#7047c9,#9669e5,#e75a9c);color:#fff;padding:11px 18px;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{background:#f8f4fc;border:1px solid #eadff4;border-radius:13px;padding:15px}.item small{display:block;color:#776b82}.tag{display:inline-block;padding:4px 8px;background:#eadff7;border-radius:20px;font-size:10px;margin-top:8px}.empty{color:#776b82}@media(max-width:750px){.grid,.items{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">انشر ➤</div><a href="dashboard.html">← لوحة التحكم</a></div><h1>مكتبة المحتوى</h1><div class="panel"><div class="grid"><div><label>عنوان المحتوى</label><input id="title" placeholder="مثال: إعلان خدمة جديدة"></div><div><label>التصنيف</label><select id="cat"><option>تسويقي</option><option>توعوي</option><option>إعلاني</option><option>موسمي</option></select></div></div><label>النص</label><textarea id="body" placeholder="اكتب النص المراد حفظه"></textarea><button class="btn" onclick="saveItem()">حفظ في المكتبة</button></div><div class="panel"><h2>المحتوى المحفوظ</h2><div id="items" class="items"></div></div></div><script src="app-state.js"></script><script>if(!Anshur.requireAuth())throw new Error('auth');function render(){const a=Anshur.get().library,r=document.getElementById('items');r.innerHTML=a.length?'':'<div class="empty">لا يوجد محتوى محفوظ بعد.</div>';a.forEach(x=>{const e=document.createElement('div');e.className='item';e.innerHTML='<b>'+x.title+'</b><small>'+x.body.slice(0,90)+'</small><span class="tag">'+x.category+'</span>';r.appendChild(e)})}function saveItem(){const t=document.getElementById('title').value.trim(),b=document.getElementById('body').value.trim(),c=document.getElementById('cat').value;if(!t||!b){alert('أكملي العنوان والنص.');return}Anshur.addLibraryItem(t,b,c);document.getElementById('title').value='';document.getElementById('body').value='';render()}render();</script></body></html>
