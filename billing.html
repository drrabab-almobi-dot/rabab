<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فوترة انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#eee6f8;color:#291b3c}.wrap{max-width:1050px;margin:auto;padding:35px}.top{display:flex;justify-content:space-between}.logo{font-size:30px;font-weight:800;color:#7047c9}a{color:#7047c9;text-decoration:none;font-weight:700}.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.plan,.panel{background:#fff;border-radius:16px;padding:20px;margin-top:18px}.plan strong{display:block;font-size:27px;color:#7047c9;margin:10px 0}.plan span{font-size:12px}.selected{outline:2px solid #8d62dd}.btn{width:100%;border:1px solid #bba5df;background:#f5effb;padding:9px;border-radius:9px;font-family:inherit;font-weight:700;margin-top:13px;cursor:pointer}.methods{display:flex;gap:10px;flex-wrap:wrap}.method{padding:12px 18px;border-radius:10px;background:#f5effb;border:1px solid #d5c3eb}.notice{background:#fff7fb;border:1px solid #edc6da;padding:14px;border-radius:12px;margin-top:18px;font-size:12px}@media(max-width:800px){.plans{grid-template-columns:1fr 1fr}}@media(max-width:500px){.plans{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">انشر ➤</div><a href="dashboard.html">← لوحة التحكم</a></div><h1>الباقات والفوترة</h1><div class="plans" id="plans"></div><div class="panel"><h2>مسار الدفع عند الإطلاق</h2><div class="methods"><div class="method">سلة</div><div class="method">زد</div><div class="method">ميسر — لاحقًا</div></div><div class="notice" id="msg">لا يوجد دفع فعلي. اختيار الباقة هنا يغيّر حالة النموذج فقط.</div></div><div class="panel"><h2>رصيد X</h2><p>محفظة مستقلة مستقبلًا لرسوم X API. الرصيد الحالي في النموذج: <b id="wallet">0</b> ر.س.</p></div></div><script src="app-state.js"></script><script>if(!Anshur.requireAuth())throw new Error('auth');const data=[['التجربة',0,10,2,'7 أيام • حسابان • 10 منشورات'],['البداية',49,30,2,'حسابان • 30 منشورًا'],['الانتشار',99,100,4,'4 حسابات • 100 منشور'],['الشاملة',149,300,6,'6 حسابات • 300 منشور']];function render(){const s=Anshur.get(),r=document.getElementById('plans');r.innerHTML='';data.forEach(x=>{const d=document.createElement('div');d.className='plan '+(s.plan.name===x[0]?'selected':'');d.innerHTML='<b>'+x[0]+'</b><strong>'+x[1]+' ر.س</strong><span>'+x[4]+'</span><button class="btn">'+(s.plan.name===x[0]?'الحالية':'اختيار تجريبي')+'</button>';d.querySelector('button').onclick=()=>choose(x);r.appendChild(d)});document.getElementById('wallet').textContent=s.settings.xWallet||0}function choose(x){Anshur.setPlan(x[0],x[2],x[3]);document.getElementById('msg').textContent='✓ تم اختيار باقة '+x[0]+' داخل النموذج فقط — لم تتم أي عملية دفع أو خصم.';render()}render();</script></body></html>
