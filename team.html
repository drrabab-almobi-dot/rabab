<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فريق انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#eee6f8;color:#291b3c}.wrap{max-width:1000px;margin:auto;padding:34px}.top{display:flex;justify-content:space-between}.logo{font-size:30px;font-weight:800;color:#7047c9}a{color:#7047c9;text-decoration:none;font-weight:700}.panel{background:#fff;border-radius:16px;padding:21px;margin-top:18px}.row{display:grid;grid-template-columns:1.4fr 1.6fr 1fr auto;gap:10px}input,select{padding:12px;border:1px solid #d9cbea;border-radius:10px;font-family:inherit}.btn{border:0;background:#7047c9;color:#fff;padding:11px 17px;border-radius:10px;font-family:inherit;font-weight:800}.member{display:grid;grid-template-columns:1.2fr 1.5fr 1fr 1fr;gap:10px;padding:13px;border-bottom:1px solid #eee4f6}.member small{color:#776b82}.status{color:#16815c;font-weight:700}.empty{color:#776b82}@media(max-width:700px){.row,.member{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">انشر ➤</div><a href="dashboard.html">← لوحة التحكم</a></div><h1>الفريق والصلاحيات</h1><div class="panel"><div class="row"><input id="name" placeholder="الاسم"><input id="email" placeholder="البريد الإلكتروني التجريبي"><select id="role"><option>محرر محتوى</option><option>مراجع</option><option>مدير</option></select><button class="btn" onclick="add()">إضافة تجريبية</button></div><p><small>لا تُرسل دعوات بريدية في هذه النسخة.</small></p></div><div class="panel"><h2>أعضاء الفريق</h2><div id="members"></div></div></div><script src="app-state.js"></script><script>if(!Anshur.requireAuth())throw new Error('auth');function render(){const a=Anshur.get().team,r=document.getElementById('members');r.innerHTML='<div class="member"><b>مدير الحساب</b><small>'+Anshur.get().user.email+'</small><small>المالك</small><span class="status">نشط</span></div>';if(!a.length)return;a.forEach(x=>{const e=document.createElement('div');e.className='member';e.innerHTML='<b>'+x.name+'</b><small>'+x.email+'</small><small>'+x.role+'</small><span class="status">دعوة تجريبية</span>';r.appendChild(e)})}function add(){const n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim(),r=document.getElementById('role').value;if(!n||!e){alert('أكملي الاسم والبريد التجريبي.');return}Anshur.addTeamMember(n,e,r);document.getElementById('name').value='';document.getElementById('email').value='';render()}render();</script></body></html>
