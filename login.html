<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:linear-gradient(135deg,#ded0f1,#f4effa,#dbcbed);color:#291b3c;min-height:100vh;display:grid;place-items:center}.box{width:min(440px,92%);background:#fff;padding:30px;border-radius:22px;box-shadow:0 20px 50px #6f4aa522}.logo{text-align:center;font-size:32px;font-weight:800;color:#7047c9}h1{text-align:center}input{width:100%;padding:13px;border:1px solid #d8cae9;border-radius:10px;margin:7px 0 14px;font-family:inherit}.btn{width:100%;border:0;background:linear-gradient(90deg,#7047c9,#9669e5,#e75a9c);color:#fff;padding:13px;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer}.note{font-size:11px;color:#766980;margin-top:13px;text-align:center}</style></head><body><div class="box"><div class="logo">انشر ➤</div><h1>تسجيل الدخول التجريبي</h1><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com"><label>كلمة المرور</label><input id="pass" type="password" placeholder="••••••••"><button class="btn" onclick="login()">دخول</button><div class="note">نسخة عرض محلية: لا تُرسل بياناتك إلى خادم. استخدمي بيانات تجريبية فقط.</div></div><script>function login(){const e=document.getElementById('email').value,p=document.getElementById('pass').value;if(!e||!p){alert('أكملي البريد وكلمة المرور التجريبيين.');return}localStorage.setItem('anshur_demo_user',e);location.href='dashboard.html'}</script></body></html>
