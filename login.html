<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#eee6f8;color:#2b1d40}.wrap{min-height:100vh;display:grid;place-items:center;padding:25px}.box{width:min(430px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(80,45,120,.12)}.logo{font-size:30px;font-weight:800;color:#7047c9;margin-bottom:5px}.sub{font-size:13px;color:#74677e;margin-bottom:22px}label{font-size:12px;font-weight:700}input{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #d9cae8;border-radius:10px;font-family:inherit}.btn{width:100%;border:0;background:linear-gradient(90deg,#7047c9,#9568e5,#e75a9c);color:#fff;padding:13px;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{margin-top:14px;font-size:12px;padding:10px;border-radius:9px;background:#f8f3fc;display:none}.links{text-align:center;margin-top:15px;font-size:12px}.links a{color:#7047c9;text-decoration:none}</style></head><body><div class="wrap"><div class="box"><div class="logo">انشر ➤</div><div class="sub">تسجيل دخول حقيقي وآمن عبر Supabase.</div><form id="loginForm"><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="email" placeholder="name@example.com"><label>كلمة المرور</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••"><button class="btn" id="submitBtn" type="submit">تسجيل الدخول</button></form><div id="msg" class="msg"></div><div class="links"><a href="signup.html">إنشاء حساب جديد</a> · <a href="index.html">العودة للرئيسية</a></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const form=document.getElementById('loginForm'),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');function show(t,ok){msg.style.display='block';msg.style.color=ok?'#12865f':'#a33';msg.textContent=t}async function init(){const{data}=await anshurSupabase.auth.getSession();if(data.session)location.href='dashboard.html'}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='جارٍ الدخول...';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const{error}=await anshurSupabase.auth.signInWithPassword({email,password});if(error){show(error.message==='Invalid login credentials'?'البريد الإلكتروني أو كلمة المرور غير صحيحة.':error.message,false);btn.disabled=false;btn.textContent='تسجيل الدخول';return}location.href='dashboard.html'});init();</script></body></html>
