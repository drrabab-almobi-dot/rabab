<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:linear-gradient(135deg,#ded0f1,#f4effa,#dbcbed);color:#291b3c;min-height:100vh;display:grid;place-items:center}.box{width:min(440px,92%);background:#fff;padding:30px;border-radius:22px;box-shadow:0 20px 50px #6f4aa522}.logo{text-align:center;font-size:32px;font-weight:800;color:#7047c9}h1{text-align:center}input{width:100%;padding:13px;border:1px solid #d8cae9;border-radius:10px;margin:7px 0 14px;font-family:inherit}.btn{width:100%;border:0;background:linear-gradient(90deg,#7047c9,#9669e5,#e75a9c);color:#fff;padding:13px;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer;margin-top:5px}.demo{background:#f2eafa;color:#6541a8;border:1px solid #cdb8e7}.note,.status{font-size:11px;color:#766980;margin-top:13px;text-align:center}.status{color:#9b315d;font-weight:700}</style></head><body><div class="box"><div class="logo">انشر ➤</div><h1>الدخول إلى النسخة التجريبية</h1><label>البريد الإلكتروني</label><input id="email" type="email" value="demo@anshur.sa"><label>كلمة المرور التجريبية</label><input id="pass" type="password" value="12345678"><button class="btn" onclick="login()">دخول</button><button class="btn demo" onclick="quickDemo()">دخول سريع للعرض</button><div id="status" class="status"></div><div class="note">هذه ليست مصادقة حقيقية. البيانات تجريبية ولا تُرسل إلى خادم.</div></div><script src="app-state.js"></script><script>function go(){window.location.href='dashboard.html'}function quickDemo(){try{if(window.Anshur){Anshur.login('demo@anshur.sa')}else{localStorage.setItem('anshur_demo_fallback','demo@anshur.sa')}go()}catch(e){document.getElementById('status').textContent='المعاينة الحالية تمنع التخزين المحلي. افتحي رابط GitHub Pages عند تفعيله.'}}function login(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;if(!e||!p){document.getElementById('status').textContent='أكملي البريد وكلمة المرور.';return}try{if(window.Anshur)Anshur.login(e);else localStorage.setItem('anshur_demo_fallback',e);go()}catch(err){document.getElementById('status').textContent='تعذر حفظ جلسة الدخول في بيئة المعاينة الحالية.'}}</script></body></html>
