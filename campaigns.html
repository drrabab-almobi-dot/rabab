<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حملات انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#eee6f8;color:#291b3c}.wrap{max-width:1050px;margin:auto;padding:35px}.top{display:flex;justify-content:space-between}.logo{font-size:30px;font-weight:800;color:#7047c9}a{color:#7047c9;text-decoration:none;font-weight:700}.panel{background:#fff;border-radius:17px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9cbea;border-radius:10px;font-family:inherit;margin:6px 0 12px}textarea{height:120px}.btn{border:0;background:linear-gradient(90deg,#7047c9,#9669e5,#e75a9c);color:#fff;padding:12px 20px;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer}.notice{background:#fff7fb;border:1px solid #edc5d9;padding:14px;border-radius:12px;margin-top:16px;font-size:12px}.item{padding:13px;border-bottom:1px solid #eee4f6}.item small{display:block;color:#776b82}.ok{color:#16815c}.empty{color:#776b82}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">انشر ➤</div><a href="dashboard.html">← لوحة التحكم</a></div><h1>حملات WhatsApp</h1><p>نموذج تجهيز للحملات الجماعية، دون إرسال فعلي أو رسوم Meta.</p><div class="panel"><div class="grid"><div><label>اسم الحملة</label><input id="name" placeholder="مثال: عروض أغسطس"></div><div><label>قائمة المستلمين</label><select id="aud"><option>عملاء تجريبيون</option><option>قائمة مستوردة لاحقًا</option></select></div></div><label>نص/قالب الحملة</label><textarea id="msg" placeholder="اكتب نص الحملة التجريبية"></textarea><button class="btn" onclick="createCampaign()">حفظ حملة تجريبية</button><div id="status" class="notice">لن يتم الإرسال خارج المنصة. لا WhatsApp API في هذه المرحلة.</div></div><div class="panel"><h2>الحملات المحفوظة</h2><div id="list"></div></div></div><script src="app-state.js"></script><script>if(!Anshur.requireAuth())throw new Error('auth');function render(){const a=Anshur.get().campaigns,l=document.getElementById('list');l.innerHTML=a.length?'':'<div class="empty">لا توجد حملات محفوظة بعد.</div>';a.forEach(x=>{const e=document.createElement('div');e.className='item';e.innerHTML='<b>'+x.name+'</b><small>'+x.audience+' • '+x.message.slice(0,65)+'</small><small class="ok">✓ محفوظ محليًا • 0 رسالة فعلية • 0 ريال</small>';l.appendChild(e)})}function createCampaign(){const n=document.getElementById('name').value.trim(),m=document.getElementById('msg').value.trim(),a=document.getElementById('aud').value,s=document.getElementById('status');if(!n||!m){s.textContent='أكملي اسم الحملة ونصها.';return}Anshur.addCampaign(n,m,a);s.textContent='✓ تم حفظ الحملة محليًا فقط دون اتصال بـ WhatsApp API.';document.getElementById('name').value='';document.getElementById('msg').value='';render()}render();</script></body></html>
