<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابات انشر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#eee6f8;color:#291b3c}.wrap{max-width:1050px;margin:auto;padding:35px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:800;color:#7047c9}.back{color:#7047c9;text-decoration:none;font-weight:700}.notice,.box{background:#fff;border-radius:16px;padding:20px;margin-top:18px}.notice{background:#fff7fb;border:1px solid #ecc7db}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.service{background:#fff;border-radius:15px;padding:20px;display:flex;align-items:center;gap:15px}.icon{width:48px;height:48px;border-radius:12px;background:#f1e8fa;display:grid;place-items:center;font-weight:800;color:#7047c9}.info{flex:1}.info b,.info small{display:block}.info small{color:#766b80}.btn{border:1px solid #bca6dd;background:#f8f4fc;color:#5d3da3;padding:9px 15px;border-radius:9px;font-family:inherit;font-weight:700;cursor:pointer}.connected{background:#e9f8f1;color:#167451;border-color:#b9e2d0}.commerce{border:1px solid #c9afe7}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.step{padding:16px;background:#f8f4fc;border-radius:12px}.step strong{color:#7047c9;font-size:21px}.step span{display:block;font-size:12px}.danger{font-size:12px;color:#7b6573}@media(max-width:700px){.grid,.steps{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">انشر ➤</div><a class="back" href="dashboard.html">← لوحة التحكم</a></div><h1>ربط الحسابات والتكاملات</h1><p>حالة الربط التجريبية تُحفظ الآن على جهازك، دون استدعاء API خارجي.</p><div class="notice"><b>حماية الميزانية مفعّلة</b><div class="danger">لا بيانات اعتماد ولا خدمات مدفوعة في هذه النسخة.</div></div><div class="grid" id="services"></div><div class="box"><h2>طريقة الربط عند التفعيل</h2><div class="steps"><div class="step"><strong>1</strong><span>اختيار المنصة.</span></div><div class="step"><strong>2</strong><span>الموافقة عبر OAuth الرسمي.</span></div><div class="step"><strong>3</strong><span>حفظ الرمز في Backend آمن، وليس المتصفح.</span></div></div></div></div><script src="app-state.js"></script><script>const data=[['instagram','IG','Instagram'],['facebook','FB','Facebook'],['threads','TH','Threads'],['linkedin','IN','LinkedIn'],['tiktok','TT','TikTok'],['x','X','X'],['salla','س','سلة'],['zid','ز','زد']],root=document.getElementById('services');function draw(){root.innerHTML='';const s=Anshur.get();data.forEach((x,i)=>{const on=!!s.connections[x[0]],e=document.createElement('div');e.className='service '+(i>5?'commerce':'');e.innerHTML='<div class="icon">'+x[1]+'</div><div class="info"><b>'+x[2]+'</b><small>'+(on?'متصل تجريبيًا • محفوظ محليًا':'غير متصل • وضع تجريبي')+'</small></div><button class="btn '+(on?'connected':'')+'">'+(on?'✓ متصل تجريبيًا':'تجربة الربط')+'</button>';e.querySelector('button').onclick=()=>{Anshur.setConnection(x[0],!Anshur.get().connections[x[0]]);draw()};root.appendChild(e)})}draw();</script></body></html>
